services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - ecommerce_internal

  migrate:
    build:
      target: development
    environment:
      NODE_ENV: development
    command: ["npm", "run", "migration:run"]
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
      MAIL_PROVIDER: mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_FROM: E-commerce <no-reply@ecommerce.test>
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mailpit:
        condition: service_started

  frontend:
    build:
      target: development
    environment:
      NODE_ENV: development
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
